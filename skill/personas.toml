# One block per person. Adding someone = build their corpus + profile with
# pipeline/ (see README) and add a block here. Relative paths resolve against
# $PANTHEON_CORPUS (default ~/pantheon-corpus); absolute paths are used as-is.
# `span` describes the corpus the original author built - update it for yours.

[musk]
name = "Elon Musk"
